# Dependency updates target `staging`, not the default branch.
#
# `master` is the branch production builds from. Without an explicit
# `target-branch`, dependabot opens every PR against the default branch —
# `master` — so a merged bump ships straight to production without ever
# running on staging. That inverts the staging -> master promote model the
# rest of the repo follows.
#
# `target-branch` is a per-update key, so it has to be repeated for each
# ecosystem below; there is no top-level form. Dependabot reads this file
# from the DEFAULT branch only, so this config must stay on `master` to take
# effect — a copy on `staging` alone does nothing.
version: 2
updates:
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

  # .NET NuGet dependencies
  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Assemblies the Nethermind runtime image already ships in /nethermind/.
    # These are NOT ordinary dependencies: the plugin publishes its copy into
    # /nethermind/plugins/, and if the two assembly identities differ the CLR
    # refuses to load ours and the node dies during init, restarting forever
    # (System.IO.FileLoadException, 0x80131040). They must EQUAL the image's
    # version, not merely satisfy a range — so "newer" is a downgrade in
    # correctness and dependabot cannot reason about it.
    #
    # Both of these have already caused it while moving the image 1.37.2 ->
    # 1.39.3: Nethermind.Numerics.Int256 1.6.0 aborted before any Circles code
    # ran, and Autofac 9.3.2 killed the node during plugin init.
    #
    # Bump these only together with the runtime image, and verify with
    # scripts/check-plugin-assembly-versions.sh against the image itself
    # rather than against nuget's latest.
    ignore:
      - dependency-name: "Nethermind.*"
      - dependency-name: "Autofac"
      - dependency-name: "Autofac.Extensions.DependencyInjection"
    # Group minor and patch updates together
    groups:
      test-dependencies:
        patterns:
          - "*.Test*"
          - "xunit*"
          - "NUnit*"
          - "FluentAssertions*"
          - "Moq*"

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/docker"
    target-branch: "staging"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"
      include: "scope"
